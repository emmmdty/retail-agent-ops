schema_version: "4.0"
policy_version: "4.0.0"
refund_reasons:
  - damaged
  - wrong_item
  - not_as_described
  - changed_mind
cancel_reasons:
  - changed_mind
  - duplicate_order
  - billing_error
  - quality_concern
max_transient_retries: 1
rules:
  - refund_requires_lookup
  - customer_must_own_order
  - refund_window_must_be_open
  - duplicate_refund_forbidden
  - transient_retry_is_bounded
  - tool_schema_is_strict
  # 新增：取消订单相关规则
  - cancel_requires_lookup
  - cancel_window_must_be_open
  - duplicate_cancel_forbidden
