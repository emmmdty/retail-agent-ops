# R3 正式全量 QLoRA-SFT: 240 条 train + 60 条 dev，单卡 4-bit NF4，assistant-only loss。
# 超参沿用 training/sft.py 的既有默认值（有效 batch = 2 x 8 = 16，lr 2e-4，3 epoch）。
# 输出目录不可覆盖（_ensure_new_training_output），每次正式运行用新目录。
# model.revision 是 ModelScope Qwen/Qwen3-4B 的仓库提交哈希；model.file_sha256 是
# gpu-5090 上 models/Qwen3-4B-pinned/ 用 `hash_local_model_files` 逐文件重算的真实值
# （与 configs/retail_ops_v1_r2_qwen3_4b_dev.yaml 同一份模型文件）。run_sft 在任何
# 产物落盘前调用 verify_local_model_files 逐文件核对，哈希不符即拒绝训练。
#
# data.*_relpath 是私有根内的相对路径；私有根前缀由 --input_dir 在运行时提供，
# 不写进版本控制的配置文件（与 R2 teacher/export 流水线同一约定）。
#
# max_seq_len=1024 沿用训练器默认值，尚未经真实 Qwen3 tokenizer 审计确认足够
# （字符数粗估 p95≈1025 字符，但字符数不等于 token 数）。正式全量训练前必须先跑
# token 长度审计；若 p95/max 超过该预算，需要先与用户确认调大还是接受截断，不得静默截断。
pipeline: sft
model:
  name: models/Qwen3-4B-pinned
  load_in_4bit: true
  revision: "8cd0101f70cac4f1efcebc979faf483558e39297"
