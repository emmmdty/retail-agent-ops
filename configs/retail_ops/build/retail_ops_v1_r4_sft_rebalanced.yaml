# R4 Task 1 全量 QLoRA-SFT（重平衡数据）：唯一改动是训练数据换成
# train-export-002（多步家族各 ×3，sft 行数 240 -> 400），model / lora / training
# 三段与 configs/retail_ops/build/retail_ops_v1_r3_sft.yaml 逐字段相同——
# "每轮只改一个主要变量"由 tests/test_retail_ops_r4_cli.py 断言，不靠自觉。
#
# eval 数据仍是 dev-sft-001：它不参与梯度、save_strategy=no，换掉只会让本轮与 R3 的
# loss 曲线不可比。dev SFT 的最终回复是 Oracle 常量串，eval_loss 只是弱 sanity 信号
# （LOG-20260807-06），候选质量的权威依据是 60 条 dev 任务的行为式评测。
#
# 预计成本：400/240 x 134 s ≈ 224 s，75 steps，峰值显存与 R3 同量级（5.16 GiB）。
# 输出目录不可覆盖（_ensure_new_training_output），必须用新目录，不得写 r3/sft-001。
#
# 超参沿用 training/sft.py 的既有默认值（有效 batch = 2 x 8 = 16，lr 2e-4，3 epoch）。
# model.revision 是 ModelScope Qwen/Qwen3-4B 的仓库提交哈希；model.file_sha256 是
# gpu-5090 上 models/Qwen3-4B-pinned/ 用 `hash_local_model_files` 逐文件重算的真实值
# （与 configs/retail_ops/evaluate/retail_ops_v1_r2_qwen3_4b_dev.yaml 同一份模型文件）。run_sft 在任何
# 产物落盘前调用 verify_local_model_files 逐文件核对，哈希不符即拒绝训练。
#
# data.*_relpath 是私有根内的相对路径；私有根前缀由 --input_dir 在运行时提供，
# 不写进版本控制的配置文件（与 R2 teacher/export 流水线同一约定）。
#
pipeline: sft
