# R4 第二轮候选 B（数据闭环）：唯一改动是训练数据换成 train-export-003——
# 在 refund_eligible / refund_recovery 样本末尾追加一条独立的 assistant 终局回复，
# 使 tool_call 路径获得自然终点。model / lora / training 三段与
# configs/retail_ops/build/retail_ops_v1_r4_sft_rebalanced.yaml 逐字段相同，由
# tests/test_retail_ops_r4_round2_cli.py::test_round2_b_changes_exactly_one_variable 断言。
#
# 依据：train-export-002 里 60% 的样本以 tool 消息结尾，模型在训练中从未见过
# "退款成功之后长什么样"，只见过 denied 类"分析完就结束"。候选在 dev 上的实际行为
# （正确读状态、正确判定可退、产出分析文本、请求确认后停止）正是后一种模式的照搬。
# 根源是 runner.py 在 final_state == 1.0 时立即 break，退款成功那一刻轨迹被截断，
# 因此 teacher 证据里根本不存在这段终局文本——这是环境与 runner 的设计后果，不是 bug。
#
# 重采样因子与第一轮完全相同：B 的变量是"多步路径有没有闭环"，不是样本数。
# 预计成本：~500 s（sft 行数与第一轮同为 400，每行多一小段文本）。
