# R2 train_export: 质量门通过后为全部 240 条 train 任务选定轨迹（优先 teacher，
# 否则回退确定性 internal reference）并导出 train.jsonl/sft.jsonl。
# teacher_attempt_id 必须指向已经跑过 teacher_collect 的 attempt；--input_dir
# 复用同一个 formal_freeze 私有根，--output_dir 是本次导出自己的新产物目录
# （只包含公开聚合 quality.json，不含任务级真值）。
pipeline: train_export
bundle_dir: domains/retail_ops/v1
public_dir: manifests/retail_ops/v1/retail_ops_v1_r2_20260722
dataset_version: retail_ops_v1_r2_20260722
teacher_attempt_id: teacher-full-001
attempt_id: train-export-001
# 本次不做任何重复采样：这份导出是 R3 候选的训练输入，也是 R4 重平衡实验的对照基线。
# 该键必填，空 mapping 与省略不等价——省略会被命令契约拒绝。
sft_oversample: {}

# R4 第二轮新增的两个必填变换键：本配置是这两项变换之前的基线，显式声明未启用。
# 空列表 / null 与"忘了写"必须可区分，因此两个键都没有默认值。
sft_terminal_response: []
sft_system_prompt_sha256: null

# R6 新增键。`null` = 不做措辞增强，与本文件此前的行为逐字节相同。
# 键集合是精确匹配契约，因此这里必须显式声明——「忘了写」是硬错误，不是默认值。
sft_paraphrase: null
