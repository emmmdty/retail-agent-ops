# R6 候选 sft-007：与发布候选 sft-006 的 SFT 配置**逐字段相同**，
# 唯一差别是 data.train_relpath 从 train-export-004 换成 train-export-006
# （同一批冻结任务、同一批 teacher 证据、同一个 system prompt，
#  只是每条任务多了 3 条「只改写 user 第一句话」的样本）。
# 由 tests/test_retail_ops_r6_cli.py::test_r6_sft_changes_exactly_one_variable 逐字段断言。
#
# 它要修的是 LOG-20260816-01 暴露的那件事：拿到 GO 的候选在分布外表达上 0/20，
# 且把零训练基座本来会做的 code_switch(1.0) 与 colloquial(0.5) 打成了 0.0。
#
# **必须一起说的连带变化**：sft 行数 400 → 1600，因此同样 3 epoch 下
# 梯度步数 75 → ~300。本轮的自变量不是纯粹的「说法更多样」，
# 它同时也是「训练更久」，两者在这个设计里分不开。
#
# 预计：~20 分钟（sft-006 是 400 行 / 75 步 / 293.7 s）。输出目录不可覆盖。
