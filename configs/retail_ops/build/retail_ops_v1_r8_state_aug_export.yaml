# R8 状态增强导出：在**冻结网格之外**的 margin 上补训练素材。
#
# **假设（在跑任何复测之前写定，见 docs/POLICY_BOUNDARY.md §5）**：
# 候选 sft-008 在政策边界探针的 15 个偏移量里 14 个是 1.00，唯独 offset −14
# （refund_deadline = 6）塌到 0.375，全部 5 次政策违规都在那一点；而
# refund_denied_window 的训练集里 margin ≥ 10 的 family 只占 10%、封存集占 50%。
# 假设是：远超期区域的训练覆盖过薄；补上该区域能把这一格拉起来且不破坏放行侧。
#
# **为什么用网格外的 margin**：冻结契约只用 7 个 margin（1,2,3,5,7,10,14），
# 每场景 35 个 family 已穷尽分配给 train/dev/holdout。在网格**内**多造训练数据
# 会复现某个 dev/holdout family 的语义——那是泄漏。网格的补集是自由的，
# 由 assert_disjoint_from_frozen_grid() 在构建时断言。
#
# **为什么两侧都补**：只补拒绝侧的话，「学会了规则」与「学会了多拒绝」
# 在读数上无法区分，而后者会在放行侧塌掉。两侧用同一组 margin。
#
# **与评测点不相交**：探针在 refund_deadline = 6 与 10 上测，增强素材一条都不用
# 这两个值（assert_disjoint_from_probe()）。因此复测是区域内的插值/外推，不是记忆。
#
# 增强量：7 个 margin × 4 实例 × 2 侧 = 56 条任务，× (1 + 3 条措辞改写) = 224 行，
# 相对基底 960 行约 +23%。
pipeline: state_aug_export
bundle_dir: domains/retail_ops/v1
# 基底训练集：sft-008 用的那一份，一个字不改地作为前缀。
base_attempt_id: train-export-007
attempt_id: train-export-008
# 上限由 TeacherCollectionConfig 约束（≤2 / ≤3），与既有 teacher 采集同口径。
max_episodes_per_task: 2
max_request_attempts: 3

# 措辞改写走与既有 960 行**同一条**路径、同一份池子、同一个 train_aug 分片——
# 否则表面形式会成为第二个变量，而 R6 的全部结论正建立在"只改说法"这个单变量上。
# bank_sha256 是声明的期望值：换了池子却忘了改这里会静默产出另一份训练集。
sft_paraphrase:
  bank_relpath: phrasing/phrasing-bank-001/phrasings.jsonl
  bank_sha256: "a34b25ac6f2b1ae24f9c2a135e3ac11a47ac8b401f676cc50b8c2bce1720b4f6"
  per_task: 3
