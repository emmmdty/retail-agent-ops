# R4 第三轮实验 1（容量 × 指令框定的叠加）：候选 A 的 LoRA 容量
# （全 linear layer）+ 候选 C 的训练数据（train-export-004，system 消息为新 prompt）。
#
# 这是第二轮**唯一**值得叠加的组合，回答一个第二轮无法回答的问题：
# **在最好的 prompt 之上，训练还有没有独立增量？**
#
# 第二轮的三个读数把问题逼到了这里——新 prompt 零训练的 base 已经是 54/60
# （refund_eligible 9/10），而候选 A 的 60/60 是在**旧** prompt 下、对照旧 base（48/60）
# 取得的。若拿旧 prompt 的 base 去做 release 判定，+0.200 的 delta 里有多少属于训练、
# 多少属于"没给 base 换 prompt"，无法分离。契约上合法，科学上站不住。
#
# 本次配对对照是 qwen3-4b-dev-base-002（新 prompt，零训练，54/60），两侧同 prompt。
# 判读：
#   - 显著高于 54/60 -> 训练在最优 prompt 之上仍有独立增量
#   - 约等于 54/60   -> 训练价值几乎被 prompt 覆盖，这条线不该继续训练
# 两种结果都是硬结论；后者会改写简历口径，但不会让本轮白做。
#
# 相对候选 A 的唯一差别是 data.train_relpath（002 -> 004）；
# 相对候选 C 的唯一差别是 lora.target_modules（attention-only -> 全 linear）。
# 两条都由 tests/test_retail_ops_r4_round3_cli.py 断言。
