# OOD v2.3（sealed）：**第四份素材**上的同一个评测集（D4 一次性 v1.3 发布判定用）。
#
# 相对 `retail_ops_ood_v2_2_sealed_build.yaml` 只差 `phrasing` 一段——生成器、状态空间、
# 六场景 × 10 的配额、判定逻辑与 verifier 逐字段相同。**唯一的自变量是措辞池是哪一份。**
# 由 `tests/test_retail_ops_r7_rebuild.py::test_the_v23_sealed_config_differs_from_v22_only_by_the_bank`
# 断言。
#
# ## 素材（phrasing-bank-004）的生成条件（与 bank-002/003 的真实差异，记台账）
#
# - **provider/model：mimo-v2.5**（用户 2026-09-04 指定端点）；bank-002/003 是
#   DeepSeek。这是素材层面的真实差异。
# - 生成 prompt 的 retry 意图 brief 做了强化（要求字面可见的重试指令句）：mimo 对
#   retry 语义的生成-回环分类失配（两次生成失败于 min_per_partition_intent=12），
#   强化后第三次成功。bank-002/003 用原始 brief。
# - per_intent 150，产出 932 条（v2.2 的 268 条先例）；三分 459/247/226，
#   八风格全覆盖；bank_sha256 `f4b14e8d7b38b4967dba2c93f4d70374470d61cc27a20f2387df8d6548b87d47`。
# - 互斥性实测：`ood_sealed` 226 条归一化措辞与 bank-002/003 全部分片、与
#   `train-export-007/sft.jsonl` 的 184 种说法交集**全部为 0**
#   （`manifests/retail_ops/v1/phrasing_exclusivity.json`，进 Git 可公开核对）。
#
# ## 观测纪律
#
# 这个分片**只观测一次**，运行内容（零训练基座 / `sft-008` 合并形态）与判读规则
# 在观测**之前**写定并提交（`task_plan.md`，commit `9b1c61b`）。**不得因为读数
# 不好看而再生成 bank-005 重测**——那就是对着封存集调参。观测后分片退役。
# 台账见 `docs/OOD_SEALED_LEDGER.md`。
#
# `dataset_version` 必须与 v2/v2.2 不同：两批内容完全不同的评测集必须在 manifest
# 层可区分（版本↔内容双射）。
pipeline: ood_build
bundle_dir: domains/retail_ops/v1
phrasing:
  dataset_version: retail_ops_ood_v2_3_20260905
  bank_relpath: phrasing/phrasing-bank-004/phrasings.jsonl
  bank_sha256: "f4b14e8d7b38b4967dba2c93f4d70374470d61cc27a20f2387df8d6548b87d47"
  partition: ood_sealed
# `boundary` 是政策边界探针的开关，必须显式写出来（见 product_cli._run_ood_build）：
# 漏写一个开关会让产物静默变成另一份数据集，而目录名与 manifest 结构看起来正常。
boundary: false
