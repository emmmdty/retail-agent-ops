# R4 第二轮候选 A（LoRA 容量）：唯一改动是 lora.target_modules 从只覆盖 attention
# 投影扩到全部 linear layer，追加 gate_proj / up_proj / down_proj。r / alpha / dropout
# 与 model / data / training 三段全部沿用 configs/retail_ops/build/retail_ops_v1_r4_sft_rebalanced.yaml
# （R4 第一轮，sft-002 / candidate-002，45/60），由
# tests/test_retail_ops_r4_round2_cli.py::test_round2_a_changes_exactly_one_variable 逐字段断言。
#
# 依据：training/sft.py 的 target_modules 默认值从 R3 到 R4 从未被当作变量测试过，
# 两轮候选用的是同一个可能不足的容量配置。观察到的能力分裂与此吻合——格式类改变成功
# （schema_valid_rate 0.78 -> 1.00、invalid_call 41 -> 0、policy_violation 16 -> 0），
# 行为倾向类改变失败（该不该执行动作）。前者是浅层输出模式，后者需要改变条件决策。
#
# 数据零变化：复用 train-export-002，因此这一轮的 dev delta 只能来自容量。
#
# 风险：可训练参数增至约 2.5-3 倍，可能同时打坏已获得的格式收益。
# invalid_call / policy_violation / schema_valid_rate 三项必须逐项报告，
# 退化即如实记录——不因它是"推荐方案"而淡化。
#
# 预计成本：600-800 s（第一轮 466.4 s / 75 steps）。输出目录必须是新目录，
# _ensure_new_training_output 拒绝覆盖 r4/sft-002。
