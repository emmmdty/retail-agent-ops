# OOD v2（sealed）：**只换说法**的分布外任务集。
#
# 六个冻结场景 × 每场景 10 条，业务语义与 `formal_tasks._scenario_contract` 逐条对应，
# **唯一的自变量是 user 的第一句话**——它来自 LLM 措辞池的 `ood_sealed` 分片。
# 因此它与 dev/holdout 是配对的：同样的场景分布、同样的判定逻辑、同样的 verifier。
#
# 为什么必须覆盖六个场景：只在 refund_eligible 上测，最省事的「修法」是见谁都退款，
# 那会在四个拒绝类上崩掉而单场景评测集看不见。六个场景同时在场，这条捷径当场暴露。
#
# 这个分片**只观测一次**，在 ood_dev 上的迭代全部结束、代码冻结并提交之后。
# 它是本轮「扛得住分布漂移」这个声称的唯一判据；反复观测会让它退化成第二个 dev。

# 措辞池的 train_aug 分片用于训练增强，与本文件用的分片**逐条互斥**，
# 由 `assert_partitions_are_disjoint` 在加载时断言。
#
# **2026-08-17 修订（v2.1）**：外部审阅发现第一版把状态空间收窄了——每条状态只有
# 1 个订单（冻结集合 1–5）、期限余量只有 ±6（冻结集合 7 种）、订单状态只有 3 种
# （冻结集合 7 种）。也就是说它在三个维度上都**更容易**，而文档写着「唯一自变量是说法」。
# 这一版把三个维度全部对齐，那句话现在才成立。
#
# 同时**换了一份全新的措辞池**（bank-002）而不是复读 bank-001 的封存分片——
# 需要第二次测量时生成新素材，而不是再看一遍封存的那份。这才是「只观测一次」
# 该有的做法；bank-001 的封存分片就此退役，其唯一一次读数照实保留在文档里。
pipeline: ood_build
bundle_dir: domains/retail_ops/v1
phrasing:
  dataset_version: retail_ops_ood_v2_20260817
  bank_relpath: phrasing/phrasing-bank-002/phrasings.jsonl
  bank_sha256: "dffaa6f9818299930e9d896631a18f492e889eec5f05c3e1869c652591deb060"
  partition: ood_sealed
# `boundary` 是政策边界探针的开关，必须显式写出来（见 product_cli._run_ood_build）：
# 漏写一个开关会让产物静默变成另一份数据集，而目录名与 manifest 结构看起来正常。
boundary: false
