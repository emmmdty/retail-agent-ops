# 工具 schema 鲁棒性对照：**未扰动**的一侧。
#
# 与 ..._schema_perturbed.yaml 只差 perturb_schema 一个字段，两者构成
# P2-13 的对照实验：`domain/environment.py::perturb_schema` 从"写好了但从没用过"
# 变成一条真正跑的评测。
#
# policy_type=schema_adaptive 的工具名来自**当前呈现的工具清单**（按参数键集合
# 唯一匹配），而不是硬编码。用 oracle 跑同一对配置会得到相反的结果——那正是
# 这组对照要量化的东西："换一份客户的工具 schema，这套东西还能不能用"。
bundle_dir: domains/retail_ops/v1
mode: qualification
policy_type: schema_adaptive
bootstrap_samples: 1000
parser_id: hermes-single-call-v1
budget:
  max_steps: 5
perturb_schema: false
# 独立于环境的 guardrail 层开关，没有默认值：开不开第二道防线是评测条件的一部分。
guardrail: false
# 多轮澄清开关（确定性规则式模拟用户），没有默认值：它决定 episode 是单轮还是多轮。
user_simulator: false
