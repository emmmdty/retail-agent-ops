# 配对对照仍是 qwen3-4b-dev-base-002（新 prompt，零训练，54/60）——与原候选
# 用的是同一份 base 证据，因此三个读数（原候选 / 重建 seed 0 / 重建 seed 1）
# 可以直接并列。dev 的 PAIRING_FIELDS 不含 code_commit，含 system_prompt_sha256，
# 而 SYSTEM_PROMPT 自 R4 第三轮以来未变，配对成立。
#
# 判读：SPEC §6 第 6 条要求"最终候选独立重建后仍保持正向提升"。
#   - 显著高于 base-002 的 54/60 -> 该条满足
#   - 掉回 base 水平或更低       -> 该条不满足，如实记录，GO 的表述必须退回"自动门禁 GO"
# **无论结果如何都不挑选有利的那一次**：两次重建都记录、都进文档。
#
# 边界：这只在 **dev** 上做，不消耗第五次封存 holdout 观测。
#
# 关于 seed 1：这是与原候选**不同** seed 的重建，是 SPEC §6 第 6 条最严格的读法。
