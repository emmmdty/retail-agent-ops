# 与 retail_ops_v1_r4_round3_capacity_prompt_candidate.yaml（原 sft-006 候选）相比，
# **唯一**差别是 attempt_id 与 adapter 段：同一份 SFT 配置
# retail_ops_v1_r4_round3_capacity_prompt_sft.yaml、同一份训练数据 train-export-004、
# 同一个基座与同一组超参，只把 --seed 换成 1，从头重新训练出的 adapter。
