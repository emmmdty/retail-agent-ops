# 这是 sealed 契约 v1.1 的第一次真实使用。第三次观测证明了合并形态在门禁算术上全过，
# 但它**拿不到判定**——`require_comparable_sealed_runs` 当时要求 candidate = 同一基座
# + adapter，而合并版两条都不满足（LOG-20260815-03）。契约扩展之后，合并候选靠
# **可复算的血统**与 base 配对：
#
#   merged_revision == sha256(canonical_json({base_revision, adapter_file_sha256}))
