# 自己声明一个标识等于没有证明；可复算才让"这份权重确实由那个基座和那个 adapter
# 合成"成为可验证的事实。配对校验会重算它，对不上直接拒绝。
#
# 与 base 侧唯一的差别是模型与形态；生成参数、receipt、bundle、seed 全部相同。
