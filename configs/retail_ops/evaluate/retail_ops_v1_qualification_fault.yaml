bundle_dir: domains/retail_ops/v1
mode: qualification
policy_type: unknown_tool
bootstrap_samples: 1000
parser_id: hermes-single-call-v1
budget:
  max_steps: 5
# 工具 schema 扰动开关，没有默认值：它改变评测条件，
# "忘了写"与"故意不启用"必须在配置层可分辨。对照配置见
# retail_ops_v1_qualification_schema_{clean,perturbed}.yaml。
perturb_schema: false
# 独立于环境的 guardrail 层开关，没有默认值：开不开第二道防线是评测条件的一部分。
guardrail: false
