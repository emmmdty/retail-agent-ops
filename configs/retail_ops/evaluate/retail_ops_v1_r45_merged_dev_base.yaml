# 会（正确地）拒绝。本条产出的是**部署形态对照**读数，不是配对发布判定；跨形态只比
# 绝对值，并在报告里显式标注这一点。
#
# **数值不等价，因此必须重测任务指标**：合并在 bf16 下进行，这里再按同一份
# GenerationSettings 量化回 NF4。「基座 NF4 + LoRA」与「合并后再 NF4」不是同一组权重。
# 如果合并版的 task_success 掉下来，那就是量化路径的代价，必须如实报告，
# 不得只报延迟改善。
#
# revision 是**派生标识**而非上游 revision：由「基座 revision + adapter 逐文件哈希」
