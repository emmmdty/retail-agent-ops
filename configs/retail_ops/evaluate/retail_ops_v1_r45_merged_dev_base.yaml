# 隔离到单次前向开销（per_call_latency_ratio 1.9852，而 steps_to_success_ratio
# 0.9841 < 1——候选每成功一条任务的调用数比基座还少）。未合并的 LoRA 每层多两次低秩
# 矩阵乘并走一遍 4bit 反量化路径，是纯实现开销。合并不改变模型要做的事。
#
# **走 formal_dev_base 而不是 formal_dev_candidate**：合并之后模型里已经没有 adapter，
# 它就是一个新的基座权重。用 candidate 通道会要求一个 adapter pin，那是在描述一个
# 不存在的东西。
#
