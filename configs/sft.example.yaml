# 可直接运行的 Qwen3-1.7B 单卡 QLoRA-SFT 示例。
model:
  name: models/Qwen3-1.7B
  load_in_4bit: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]

data:
  train_path: data/mvp/seed0/sft/train.jsonl
  eval_path: data/mvp/seed0/sft/dev.jsonl

training:
  epochs: 3
  batch_size: 2
  grad_accum: 8
  lr: 2.0e-4
  max_seq_len: 1024
  bf16: true
  gradient_checkpointing: true
  assistant_only_loss: true
