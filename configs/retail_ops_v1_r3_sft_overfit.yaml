# R3 SFT 小样本 overfit 检查: 16 条样本反复训练，观察 train loss 是否显著下降。
# 与 smoke 目的不同——smoke 测管线，overfit 测这批 label/assistant mask 有没有系统性
# bug（mask 覆盖错时 loss 会稳定在高位不动）。这是诊断运行，不产出正式候选 adapter。
# grad_accum=2 让 16 条样本每个 epoch 有 4 个 optimizer step，才看得出趋势。
# model.revision 是 ModelScope Qwen/Qwen3-4B 的仓库提交哈希；model.file_sha256 是
# gpu-5090 上 models/Qwen3-4B-pinned/ 用 `hash_local_model_files` 逐文件重算的真实值
# （与 configs/retail_ops_v1_r2_qwen3_4b_dev.yaml 同一份模型文件）。run_sft 在任何
# 产物落盘前调用 verify_local_model_files 逐文件核对，哈希不符即拒绝训练。
#
# data.*_relpath 是私有根内的相对路径；私有根前缀由 --input_dir 在运行时提供，
# 不写进版本控制的配置文件（与 R2 teacher/export 流水线同一约定）。
pipeline: sft
model:
  name: models/Qwen3-4B-pinned
  load_in_4bit: true
  revision: "8cd0101f70cac4f1efcebc979faf483558e39297"
  file_sha256:
    LICENSE: "832dd9e00a68dd83b3c3fb9f5588dad7dcf337a0db50f7d9483f310cd292e92e"
    README.md: "71add1cd091c309b1cb1a6b943f2476eb2b004124b3bd1d32dcd0b24cc1abc47"
    config.json: "8ba006f74fecfaaeb392872a60f4a480e7ec9860153d2e1b769ec81f9a147f8a"
    configuration.json: "f888421726665e8a84b738eed42a64875aed79de8be7daade851ac8bf4c0cef9"
    generation_config.json: "2325da0f15bb848e018c5ae071b7943332e9f871d6b60e2ed22ca97d4cb993d2"
    merges.txt: "8831e4f1a044471340f7c0a83d7bd71306a5b867e95fd870f74d0c5308a904d5"
    model-00001-of-00003.safetensors: "328a91d3122359d5547f9d79521205bc0a46e1f79a792dfe650e99fc2d651223"
    model-00002-of-00003.safetensors: "6cd087b316306a68c562436b5492edbcf6e16c6dba3a1308279caa5a58e21ca5"
    model-00003-of-00003.safetensors: "e4bf436957184f4eeb86a80e9db394503f1f56446b2e6b7edeac5b81470f4ca1"
    model.safetensors.index.json: "6dc0981b8829fead746441f68f38f24c5ca4a3a66351f652c26c6df0efc43ab2"
    tokenizer.json: "aeb13307a71acd8fe81861d94ad54ab689df773318809eed3cbe794b4492dae4"
    tokenizer_config.json: "d5d09f07b48c3086c508b30d1c9114bd1189145b74e982a265350c923acd8101"
    vocab.json: "ca10d7e9fb3ed18575dd1e277a2579c16d108e32f27439684afa0e10b1440910"
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]
data:
  train_relpath: train-export/train-export-001/sft.jsonl
  eval_relpath: dev-sft/dev-sft-001/sft.jsonl
  train_limit: 16
  eval_limit: 8
training:
  epochs: 15
  batch_size: 2
  grad_accum: 2
  lr: 2.0e-4
  max_seq_len: 1024
  bf16: true
  gradient_checkpointing: true
  assistant_only_loss: true
