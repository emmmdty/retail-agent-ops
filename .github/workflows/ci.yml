# RetailAgentOps CPU 回归。
#
# 2026-08-20 首次真跑通过（commit `596eee8`，run
# https://github.com/emmmdty/retail-agent-ops/actions/runs/32326919228，
# 2m12s，11 步全绿）。证据落地见 docs/CI_EVIDENCE.md。本地等价命令见 job
# 内每一步的注释。CI 跑的是 CPU 全链路与发布审计，不含 GPU / API 采集。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: CPU 质量门与全链路复现
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 同步冻结依赖
        # 本地等价：env -u UV_INDEX_URL uv sync --extra dev --frozen
        # --frozen 保证 uv.lock 逐字节生效；lock 与代码的绑定是配对契约的一部分。
        run: uv sync --extra dev --frozen

      - name: pytest
        run: uv run --frozen pytest -q

      - name: ruff lint
        run: uv run --frozen ruff check .

      - name: ruff format
        # 2026-08-16 起是硬门禁。此前只对每个任务触碰的文件做 targeted format，
        # 151 个文件里累积了 58 个漂移；一次性统一后由这一步防止回潮。
        run: uv run --frozen ruff format --check .

      - name: mypy
        run: uv run --frozen mypy

      - name: uv.lock 未漂移
        run: uv lock --check

      - name: 公开发布审计
        # LICENSE / 第三方声明 / secret / 模型权重 / holdout 真值 的静态边界扫描。
        run: uv run --frozen python scripts/ci/audit_public_release.py

      - name: CPU qualification 全链路复现
        # build → evaluate ×3 → release ×2，然后断言两份 release.json 的决策、
        # 失败门禁、bundle/manifest 内容哈希与确定性指标等于冻结期望值。
        # 这是 SPEC §11「新环境能按文档完成 CPU smoke」的唯一自动化证明。
        run: uv run --frozen python scripts/ci/verify_qualification_chain.py

      - name: 工作树保持干净
        # 全链路跑完不得留下未跟踪产物：正式运行产物只能落 ignored 目录。
        run: |
          git diff --check
          test -z "$(git status --porcelain)" || {
            echo "运行后工作树不干净："
            git status --porcelain
            exit 1
          }
